name: digest

on:
  schedule:
    - cron: "0 11 * * 2,4,6"   # Tue/Thu/Sat 11:00 UTC (7am ET summer, 6am ET winter)
  workflow_dispatch:            # adds a "Run workflow" button for manual runs

permissions:
  contents: write   # lets the job commit state.json
  pages: write      # lets the job publish the page
  id-token: write   # required by deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser requests

      - name: Build digest
        run: python digest.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Save state
        run: |
          git config user.name digest-bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m "digest $(date -u +%F)"
          git push

      - run: mkdir -p _site && cp index.html _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
