name: digest

on:
  schedule:
    - cron: "37 10 * * 2,4,6"
  workflow_dispatch:
    inputs:
      fresh_start:
        description: "Reset seen stories and rebuild"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Optional state reset
        if: ${{ inputs.fresh_start }}
        run: rm -f state.json

      - name: Build digest
        run: python digest.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}      
          
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-diagnostics
          path: diagnostics/
          if-no-files-found: ignore

      - name: Save digest and state
        run: |
          git config user.name digest-bot
          git config user.email bot@users.noreply.github.com
          git add index.html state.json archive
          if [ -d diagnostics ]; then git add diagnostics; fi
          git diff --staged --quiet && exit 0
          git commit -m "Update digest"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "Push failed (attempt $i); retrying in $((i*30))s"
            sleep $((i*30))
          done
          exit 1

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -d archive ]; then cp -r archive _site/; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
