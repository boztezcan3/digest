name: digest

on:
  schedule:
    - cron: "0 11 * * 2,4,6"
  workflow_dispatch:
    inputs:
      fresh_start:
        description: "Reset seen stories and rebuild"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Optional state reset
        if: ${{ inputs.fresh_start }}
        run: rm -f state.json

      - name: Build digest
        run: python digest.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Save digest and state
        run: |
          git config user.name digest-bot
          git config user.email bot@users.noreply.github.com
          git add index.html state.json archive
          git diff --staged --quiet || git commit -m "Update digest"
          git push

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -d archive ]; then cp -r archive _site/; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
